name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'go', 'javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
wsl --install
---

"applyTo: app/models/**/*.rb

---
---
applyTo: "**/*.ts,**/*.tsx"
---
---
applyTo: "**"
excludeAgent: "code-review"
---
# Managing GitHub Actions notifications

Learn about managing how notifications from GitHub Actions are delivered.

For repositories that are set up with GitHub Actions and that you are watching, you can choose how you want to receive workflow run updates.

1. On the "Notification settings" page, under "System", then under "Actions", select the **Don't notify** dropdown menu.

   ![Screenshot of the "System" section of the notification settings. Under "Actions", a dropdown menu titled "Don't notify" is outlined in orange.](/assets/images/help/notifications/github-actions-customize-notifications.png)
2. To opt in to web notifications, from the dropdown menu, select "On GitHub."

   To opt in to email notifications, from the dropdown menu, select "Email."
3. Optionally, to only receive notifications for failed workflow runs, from the dropdown menu, select "Only notify for failed workflows", then click **Save**.
